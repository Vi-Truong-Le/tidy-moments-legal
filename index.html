<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidy Moments — Legal &amp; Support</title>
<style>
  :root{
    --bg:#f7f6f3; --card:#ffffff; --ink:#1c1b19; --sub:#5b5750; --line:#e7e3db; --accent:#8a6a4f;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#15130f; --card:#1d1a15; --ink:#f3f0ea; --sub:#b9b2a5; --line:#332e26; --accent:#d0a97e; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:640px;margin:0 auto;padding:4rem 1.4rem 5rem}
  .badge{display:inline-block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:.6rem}
  h1{font-size:1.9rem;margin:0 0 .4rem;letter-spacing:-.01em}
  p.lead{color:var(--sub);margin:0 0 2.2rem;font-size:1.02rem}
  nav{display:flex;flex-direction:column;gap:.8rem}
  a.card{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.05rem 1.2rem;text-decoration:none;color:var(--ink);transition:border-color .15s}
  a.card:hover{border-color:var(--accent)}
  a.card span.name{font-weight:600}
  a.card span.arrow{color:var(--sub)}
  footer{margin-top:3rem;color:var(--sub);font-size:.85rem}
  footer a{color:var(--accent)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge">Tidy Moments</div>
    <h1>Legal &amp; Support</h1>
    <p class="lead">Policies and help for the Tidy Moments app, published by Vi Truong Le.</p>
    <nav>
      <a class="card" href="./privacy/"><span class="name">Privacy Policy</span><span class="arrow">→</span></a>
      <a class="card" href="./terms/"><span class="name">Terms of Use</span><span class="arrow">→</span></a>
      <a class="card" href="./support/"><span class="name">Support</span><span class="arrow">→</span></a>
    </nav>
    <footer>Contact: <a href="mailto:tremainejerde8549@icloud.com">tremainejerde8549@icloud.com</a></footer>
  </div>
</body>
</html>
